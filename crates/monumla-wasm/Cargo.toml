[package]
name = "monumla-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser WebAssembly facade for the Monumla programmable game runtime."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monumla-core.workspace = true
monumla-search.workspace = true
monumla-games-chess.workspace = true
monumla-games-checkers.workspace = true
monumla-games-go.workspace = true
monumla-games-battleship.workspace = true
monumla-games-tictactoe.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[dev-dependencies]
serde_json = "1.0"

[package.metadata.wasm-pack.profile.profiling]
# Preserve function names in optimized profiling builds; release builds stay unchanged.
wasm-opt = ["-O3", "-g"]

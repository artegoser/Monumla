[workspace]
members = [
    "crates/monumla-core",
    "crates/monumla-search",
    "crates/monumla-games-chess",
    "crates/monumla-games-checkers",
    "crates/monumla-games-go",
    "crates/monumla-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/artegoser/monumla"

[workspace.dependencies]
monumla-search = { path = "crates/monumla-search" }
monumla-core = { path = "crates/monumla-core" }
monumla-games-chess = { path = "crates/monumla-games-chess" }
monumla-games-checkers = { path = "crates/monumla-games-checkers" }
monumla-games-go = { path = "crates/monumla-games-go" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"

[workspace]
members = [
    "crates/monumla-core",
    "crates/monumla-search",
    "crates/monumla-games-chess",
    "crates/monumla-games-checkers",
    "crates/monumla-games-go",
    "crates/monumla-games-battleship",
    "crates/monumla-games-tictactoe",
    "crates/monumla-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-only"
repository = "https://github.com/artegoser/monumla"

[workspace.dependencies]
monumla-search = { path = "crates/monumla-search", version = "0.1.0" }
monumla-core = { path = "crates/monumla-core", version = "0.1.0" }
monumla-games-chess = { path = "crates/monumla-games-chess", version = "0.1.0" }
monumla-games-checkers = { path = "crates/monumla-games-checkers", version = "0.1.0" }
monumla-games-go = { path = "crates/monumla-games-go", version = "0.1.0" }
monumla-games-battleship = { path = "crates/monumla-games-battleship", version = "0.1.0" }
monumla-games-tictactoe = { path = "crates/monumla-games-tictactoe", version = "0.1.0" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
